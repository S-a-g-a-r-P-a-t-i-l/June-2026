name: Deploying application using rolling update

on:
  pull_request: 
    branches:
      - main

jobs:

  # -------------------------
  # BUILD JOB
  # -------------------------
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create application file
        run: echo "This is the testing code" > app.js

      - name: Test application file
        run: cat app.js

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-artifact
          path: app.js


  # -------------------------
  # DEPLOYMENT JOB
  # -------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        server:
          - server1
          - server2
          - server3

    steps:

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: application-artifact

      - name: Test the download
        run: cat app.js

      - name: Deployment to different server
        run: |
          echo "Deploying application to ${{ matrix.server }}"
          echo "Application deployed successfully to ${{ matrix.server }}"
